services:
  - type: web
    name: doubtbridge-api
    runtime: node
    rootDir: .
    buildCommand: npm ci && npm run build:backend && npm run db:generate:postgres
    startCommand: npm run start:production
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        sync: false
      - key: DEMO_PASSWORD
        sync: false

  - type: static_site
    name: doubtbridge-web
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
