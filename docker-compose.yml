version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: doubtbridge-db
    restart: always
    environment:
      POSTGRES_USER: doubtbridge
      POSTGRES_PASSWORD: password
      POSTGRES_DB: doubtbridge_dev
    ports:
      - '5432:5432'
    volumes:
      - doubtbridge_pgdata:/var/lib/postgresql/data

volumes:
  doubtbridge_pgdata:
